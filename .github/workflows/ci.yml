name: CI

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MODEL_MODE: mock
      INFERENCE_MODE: local
      HALLUCINATION_CHECK: on
      ENABLE_SEMANTIC: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx python-dotenv

      - name: Run GuardrailsEngine Self-Test
        run: |
          python guardrails_engine.py --selftest

      - name: Run Pytest Suite
        run: |
          pytest -q backend/tests tests

      - name: Run Metamorphic Robustness Suite
        run: |
          python -m eval.metamorphic.run --fail-under 85 --out docs/METAMORPHIC.md
